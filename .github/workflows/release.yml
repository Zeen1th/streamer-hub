name: Build beta release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore core/StreamerHub.csproj
      - run: dotnet publish core/StreamerHub.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release/StreamerHub
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:APP_VERSION = '${{ github.ref_name }}'.TrimStart('v')
          iscc /DMyAppVersion=$env:APP_VERSION installer/StreamerHub.iss
      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path release/StreamerHub/* -DestinationPath release/StreamerHub-${{ github.ref_name }}-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/installer/StreamerHub-Setup-${{ github.ref_name }}.exe
            release/StreamerHub-${{ github.ref_name }}-win-x64.zip


